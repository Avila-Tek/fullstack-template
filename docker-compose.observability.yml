# Local observability stack — OTel Collector + Loki + Prometheus + Tempo + Grafana
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Services running in Docker reach the Collector at:  http://otel-collector:4318
# Services running on the host reach the Collector at: http://localhost:4318
#
# Set in apps/api/.env:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318

services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP  ← services send here
      - "8889:8889"     # Prometheus metrics scrape endpoint (Collector self-metrics)
      - "13133:13133"   # Health check — curl http://localhost:13133/
    depends_on:
      - loki
      - prometheus
      - tempo

  loki:
    image: grafana/loki:3.1.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'   # required for otlp remote write push
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana datasource)
      - "9095:9095"   # Tempo gRPC

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
